<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BIA AI</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    background:#0a0a0a;
    color:white;
    height:100vh;
    display:flex;
    flex-direction:column;
}

header{
    background:#111;
    padding:15px;
    text-align:center;
    border-bottom:1px solid #222;
    font-size:22px;
    font-weight:bold;
    color:#00ff88;
}

.chat{
    flex:1;
    overflow:auto;
    padding:20px;
}

.msg{
    background:#161616;
    padding:15px;
    margin:10px 0;
    border-radius:12px;
    border:1px solid #222;
    white-space:pre-wrap;
}

.user{
    border-left:4px solid #00ff88;
}

.ai{
    border-left:4px solid #00aaff;
}

.barra{
    display:flex;
    padding:10px;
    background:#111;
    border-top:1px solid #222;
}

input{
    flex:1;
    padding:14px;
    border:none;
    outline:none;
    border-radius:12px;
    background:#1b1b1b;
    color:white;
    font-size:15px;
}

button{
    margin-left:10px;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#00ff88;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    opacity:0.8;
}

.topBtns{
    display:flex;
    gap:10px;
    padding:10px;
    background:#111;
    border-bottom:1px solid #222;
    overflow:auto;
}

.topBtns button{
    background:#1d1d1d;
    color:white;
}

.code{
    background:#000;
    padding:12px;
    border-radius:10px;
    margin-top:10px;
    overflow:auto;
    font-family:monospace;
    border:1px solid #333;
}

</style>
</head>

<body>

<header>
BIA AI — Assistente Programadora
</header>

<div class="topBtns">

<button onclick="novoChat()">Novo Chat</button>

<button onclick="limpar()">Limpar</button>

<button onclick="falar()">🎤 Voz</button>

<button onclick="salvar()">Salvar</button>

<input type="file" id="arquivo" onchange="lerArquivo()" style="display:none">

<button onclick="document.getElementById('arquivo').click()">
Enviar Código
</button>

</div>

<div class="chat" id="chat"></div>

<div class="barra">

<input 
type="text" 
id="pergunta" 
placeholder="Pergunte algo..."
>

<button onclick="enviar()">
Enviar
</button>

</div>

<script>

const API_KEY = "SUA_API_KEY"

let memoria = []

function addMsg(tipo,texto){

    const chat = document.getElementById("chat")

    const div = document.createElement("div")

    div.className = "msg " + tipo

    div.innerHTML = texto

    chat.appendChild(div)

    chat.scrollTop = chat.scrollHeight
}

async function enviar(){

    let pergunta = document.getElementById("pergunta").value

    if(!pergunta) return

    addMsg(
        "user",
        "<b>Você:</b><br>" + pergunta
    )

    memoria.push({
        role:"user",
        content:pergunta
    })

    document.getElementById("pergunta").value = ""

    addMsg(
        "ai",
        "BIA está pensando..."
    )

    const resposta = await fetch(
        "https://api.openai.com/v1/chat/completions",
        {
            method:"POST",

            headers:{
                "Content-Type":"application/json",
                "Authorization":"Bearer " + API_KEY
            },

            body:JSON.stringify({

                model:"gpt-4.1-mini",

                messages:[

                    {
                        role:"system",

                        content:`
Você é a BIA AI.

Uma IA especialista em:
- programação
- criação de códigos
- análise de erros
- segurança básica
- HTML
- CSS
- JavaScript
- Python
- APIs

Explique códigos de forma simples.
`
                    },

                    ...memoria
                ]
            })
        }
    )

    const dados = await resposta.json()

    document.querySelectorAll(".ai").forEach(e=>{

        if(e.innerHTML == "BIA está pensando..."){
            e.remove()
        }

    })

    let texto = dados.choices[0].message.content

    memoria.push({
        role:"assistant",
        content:texto
    })

    addMsg(
        "ai",
        "<b>BIA:</b><br>" + formatar(texto)
    )

    falarTexto(texto)
}

function formatar(txt){

    txt = txt.replace(
        /```([\s\S]*?)```/g,
        '<div class="code">$1</div>'
    )

    return txt.replace(/\n/g,"<br>")
}

function limpar(){

    document.getElementById("chat").innerHTML = ""
}

function novoChat(){

    memoria = []

    limpar()
}

function salvar(){

    let chat = document.getElementById("chat").innerHTML

    localStorage.setItem(
        "bia_chat",
        chat
    )

    alert("Chat salvo!")
}

window.onload = ()=>{

    let salvo = localStorage.getItem(
        "bia_chat"
    )

    if(salvo){

        document.getElementById("chat").innerHTML = salvo
    }
}

function falarTexto(texto){

    const fala = new SpeechSynthesisUtterance(texto)

    fala.lang = "pt-BR"

    speechSynthesis.speak(fala)
}

function falar(){

    const reconhecimento = new webkitSpeechRecognition()

    reconhecimento.lang = "pt-BR"

    reconhecimento.start()

    reconhecimento.onresult = function(event){

        document.getElementById("pergunta").value =
        event.results[0][0].transcript
    }
}

function lerArquivo(){

    const file = document.getElementById("arquivo").files[0]

    const reader = new FileReader()

    reader.onload = async function(e){

        const codigo = e.target.result

        addMsg(
            "user",
            "<b>Código enviado:</b><br><div class='code'>"
            + codigo +
            "</div>"
        )

        memoria.push({
            role:"user",
            content:
            "Analise esse código e procure erros:\n\n"
            + codigo
        })

        enviarArquivo()
    }

    reader.readAsText(file)
}

async function enviarArquivo(){

    addMsg(
        "ai",
        "Analisando código..."
    )

    const resposta = await fetch(
        "https://api.openai.com/v1/chat/completions",
        {

            method:"POST",

            headers:{
                "Content-Type":"application/json",

                "Authorization":"Bearer " + API_KEY
            },

            body:JSON.stringify({

                model:"gpt-4.1-mini",

                messages:[
                    {
                        role:"system",

                        content:`
Você é uma IA especialista em programação.
Analise códigos e encontre erros.
`
                    },

                    ...memoria
                ]
            })
        }
    )

    const dados = await resposta.json()

    document.querySelectorAll(".ai").forEach(e=>{

        if(e.innerHTML == "Analisando código..."){
            e.remove()
        }

    })

    let texto = dados.choices[0].message.content

    addMsg(
        "ai",
        "<b>BIA:</b><br>" + formatar(texto)
    )
}

</script>

</body>
</html>
